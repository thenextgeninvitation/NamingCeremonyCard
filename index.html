<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karnataka Style Namakarana & Thottilu Puja Invitation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas for exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts for Kannada & Luxury Serif Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Noto+Sans+Kannada:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        .font-kannada { font-family: 'Noto Sans Kannada', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-serif-title { font-family: 'Playfair Display', serif; }

        /* Traditional Pattern Overlay */
        .bg-silk-maroon {
            background-color: #5c0612;
            background-image: 
                radial-gradient(#d4af37 0.8px, transparent 0.8px), 
                radial-gradient(#d4af37 0.8px, #5c0612 0.8px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
        }

        .gold-inner-border {
            border: 3px solid #d4af37;
            outline: 2px solid #5c0612;
            outline-offset: -8px;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 30%, #b38728 60%, #fbf5b7 80%, #aa771c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-accent-bg {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 30%, #b38728 70%, #aa771c 100%);
        }

        /* Subtle glow for illustrations */
        .illustration-glow {
            filter: drop-shadow(0px 4px 10px rgba(212, 175, 55, 0.25));
        }
    </style>
</head>
